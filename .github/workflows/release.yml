name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - shell: bash
        run: |
          tag_commit="$(git rev-parse "refs/tags/${{ inputs.tag }}^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git fetch origin "${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"
          test "v$(node -p \"require('./package.json').version\")" = "${{ inputs.tag }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run pack
      - shell: bash
        run: |
          git diff --exit-code
          version="${{ inputs.tag }}"
          archive="artifacts/bangboo-${version#v}.tgz"
          test -f "$archive"
          npm run smoke:tarball -- "$archive"
          npm publish "$archive" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
