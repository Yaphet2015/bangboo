name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install upstream test tools on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep fd
      - run: npm ci --ignore-scripts
      - run: npm run verify

  package-audit:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run pack
      - shell: bash
        run: |
          archive="$(find artifacts -maxdepth 1 -name 'bangboo-*.tgz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive"
          npm run smoke:tarball -- "$archive"
      - run: npm sbom --package-lock-only --sbom-format cyclonedx > artifacts/build-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: bangboo-package
          path: artifacts/
