name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Node 22 bundles npm 10, whose arborist crashes ("Cannot read properties
      # of null (reading 'edgesOut')") on the staged ACP SDK install against the
      # renamed v1.1.0 workspace. Run the same npm 11 as Node 24 everywhere.
      - name: Use npm 11
        run: npm install -g npm@11
      - name: Install upstream test tools
        run: brew install ripgrep fd
      - run: npm ci --ignore-scripts
      - run: npm run verify

  package-audit:
    runs-on: macos-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The pristine upstream suite behind `npm run pack` exercises the grep
      # and find tools, which need ripgrep and fd binaries on PATH.
      - name: Install upstream test tools on macOS
        run: brew install ripgrep fd
      - run: npm ci --ignore-scripts
      - run: npm run pack
      - shell: bash
        run: |
          archive="$(find artifacts -maxdepth 1 -name 'bangboo-*.tgz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive"
          npm run smoke:tarball -- "$archive"
      - run: npm sbom --package-lock-only --sbom-format cyclonedx > artifacts/build-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: bangboo-package
          path: artifacts/
