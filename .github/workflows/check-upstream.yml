name: Check upstream

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:upstream -- --write
      - id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(node -p \"require('./upstream.lock.json').tag\")" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.changes.outputs.tag }}
        shell: bash
        run: |
          branch="automation/upstream-${UPSTREAM_TAG}"
          git config user.name "bangboo-upstream-bot"
          git config user.email "bangboo-upstream-bot@users.noreply.github.com"
          git switch -C "$branch"
          git add upstream.lock.json patches README.md NOTICE UPSTREAM_COMPATIBILITY.md
          git commit -m "chore: track upstream ${UPSTREAM_TAG}"
          git push --force-with-lease origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "chore: track upstream ${UPSTREAM_TAG}" --body "Automated upstream lock and provenance update. CI must replay the Bangboo patch series and pass the full compatibility matrix before this draft can be merged."
          else
            gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "chore: track upstream ${UPSTREAM_TAG}" --body "Automated upstream lock and provenance update. CI must replay the Bangboo patch series and pass the full compatibility matrix before this draft can be merged."
          fi
